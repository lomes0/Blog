# Production-style stack: builds the app image from the Dockerfile and wires it
# to Postgres on a private network. Reads secrets from .env (NEXTAUTH_SECRET,
# GOOGLE_CLIENT_ID/SECRET, ANTHROPIC_API_KEY, etc.); DATABASE_URL is overridden
# below to point at the `postgres` service rather than localhost.
#
#   docker compose -f docker-compose.prod.yml up --build
#
# Postgres is NOT published to the host here (unlike docker-compose.yml) — only
# the app container can reach it, over the compose network.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blog}
      POSTGRES_DB: ${POSTGRES_DB:-blog}
    volumes:
      - blog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blog} -d ${POSTGRES_DB:-blog}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: blog-simple:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Pull app secrets/config from .env. DATABASE_URL there (if any) is
    # overridden below so the app targets the compose Postgres service.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # `postgres` is the service hostname on the compose network.
      # connection_limit caps the Prisma pool; keep replicas × limit under
      # Postgres max_connections (~100 by default).
      DATABASE_URL: postgresql://${POSTGRES_USER:-blog}:${POSTGRES_PASSWORD:-blog}@postgres:5432/${POSTGRES_DB:-blog}?connection_limit=10&schema=public
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  blog-postgres-data:
