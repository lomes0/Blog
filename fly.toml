# Fly.io deployment config for blog-simple.
# Builds from the repo Dockerfile and serves on port 3000. Migrations run in a
# one-off release VM *before* the new version takes traffic, giving zero-
# downtime deploys.
#
# Change `app` to your Fly app name and `primary_region` to your nearest region
# (run `fly platform regions` to list them).

app = "blog-simple"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs in a temporary VM after build, before the new machines take traffic.
  # If it fails, the deploy is aborted and the old version keeps serving.
  release_command = "npx prisma migrate deploy"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine always warm so cold starts don't re-run migrations or
  # add latency. Set to 0 to allow scale-to-zero if you prefer.
  min_machines_running = 1
  auto_stop_machines = "stop"
  auto_start_machines = true

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
