# Throwaway stack for the restore rehearsal — ops/restore-drill.sh,
# docs/plans/production-deployment.md §5.
#
# Nothing here is production. It exists for minutes at a time under the project
# name `blog-drill`, on its own volumes, and is torn down with them. Ports are
# bound to 127.0.0.1 only: the drill boots a copy of production data, and a
# public listener on the same box would publish it.
#
# The MinIO service is the point of the file. §5's rule is that the rehearsal
# must resolve images from a *restored copy* of the bucket, never from the live
# one — against production R2 the drill passes whatever the backup contains,
# because the pictures come from the store that was never tested, and that is
# the half whose loss the database cannot report.

name: blog-drill

services:
  postgres:
    # Must match docker-compose.prod.yml — a drill against an older major would
    # fail on the archive header and report it as a corrupt backup.
    image: postgres:17
    environment:
      POSTGRES_USER: drill
      POSTGRES_PASSWORD: drill
      POSTGRES_DB: drill
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drill -d drill"]
      interval: 3s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: drill
      MINIO_ROOT_PASSWORD: drilldrill
    ports:
      - "127.0.0.1:59000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set drill http://minio:9000 drill drilldrill &&
      mc mb --ignore-existing drill/blog-blobs
      "

  app:
    # The same image the production stack runs, whichever way it got here: a
    # local `up --build` tags blog-simple:latest, a registry deploy sets
    # APP_IMAGE. A drill against an image the box does not have fails on
    # "image not found" — after the restore has already been proved, which
    # reads as the restore failing.
    image: ${APP_IMAGE:-blog-simple:latest}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:53000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://drill:drill@postgres:5432/drill?schema=public
      NEXTAUTH_URL: http://localhost:53000
      PUBLIC_URL: http://localhost:53000
      # Any value: the drill never signs anyone in, but the app refuses to boot
      # without one.
      NEXTAUTH_SECRET: drill-only-not-a-secret
      S3_ENDPOINT: http://minio:9000
      S3_REGION: auto
      S3_ACCESS_KEY_ID: drill
      S3_SECRET_ACCESS_KEY: drilldrill
      S3_BUCKET: blog-blobs
      S3_FORCE_PATH_STYLE: "true"
